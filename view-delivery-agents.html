<html></html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Delivery Agents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #1e40af;
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Registered Delivery Agents</h1>

    <div class="container">
        <p id="message">Loading delivery agents...</p>

        <table>
            <thead>
                <tr>
                    <th>Agent ID</th>
                    <th>Agent Name</th>
                    <th>Phone</th>
                    <th>City</th>
                    <th>Availability</th>
                </tr>
            </thead>
            <tbody id="agentTable"></tbody>
        </table>
    </div>

    <script>
        async function loadAgents() {
            const message = document.getElementById("message");
            const table = document.getElementById("agentTable");

            try {
                const response = await fetch("/api/delivery-agents");
                const result = await response.json();

                if (!response.ok || !result.success) {
                    message.textContent = result.message || "Failed to load delivery agents.";
                    return;
                }

                table.innerHTML = "";

                if (result.agents.length === 0) {
                    message.textContent = "No delivery agents found.";
                    return;
                }

                result.agents.forEach(agent => {
                    const row = document.createElement("tr");

                    [
                        agent.agent_id,
                        agent.agent_name,
                        agent.phone,
                        agent.city,
                        agent.availability
                    ].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    table.appendChild(row);
                });

                message.textContent = "Total delivery agents: " + result.agents.length;
            } catch (error) {
                message.textContent = "Error loading agents. Please check the server.";
            }
        }

        loadAgents();
    </script>
</body>
</html>
