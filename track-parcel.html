<html></html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Parcel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Track Your Parcel</h1>

        <form id="trackForm">
            <input
                type="text"
                id="trackingId"
                placeholder="Enter Tracking ID"
                required
            >
            <button type="submit">Track Parcel</button>
        </form>

        <div id="result"></div>

        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const form = document.getElementById("trackForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const trackingId = document
                .getElementById("trackingId")
                .value.trim();

            result.textContent = "Searching for parcel...";

            try {
                const response = await fetch(
                    "/api/parcels/" + encodeURIComponent(trackingId)
                );

                const data = await response.json();

                if (!response.ok) {
                    result.textContent = data.message || "Parcel not found.";
                    return;
                }

                const parcel = data.parcel || data;

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = "Parcel Details";
                result.appendChild(heading);

                const details = [
                    ["Tracking ID", parcel.tracking_id],
                    ["Receiver Name", parcel.receiver_name],
                    ["Receiver Phone", parcel.receiver_phone],
                    ["Receiver Address", parcel.receiver_address],
                    ["Weight", parcel.weight ? parcel.weight + " kg" : ""],
                    ["Status", parcel.status || "Booked"]
                ];

                details.forEach(function(item) {
                    const line = document.createElement("p");
                    line.textContent = item[0] + ": " + (item[1] || "N/A");
                    result.appendChild(line);
                });
            } catch (error) {
                result.textContent =
                    "Unable to track parcel. Please check that the server is running.";
            }
        });
    </script>
</body>
</html>
