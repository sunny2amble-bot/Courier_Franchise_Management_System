<html></html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Parcel Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Update Parcel Status</h1>

        <form id="statusForm">
            <input
                type="text"
                id="trackingId"
                placeholder="Enter Tracking ID"
                required
            >

            <select id="status" required>
                <option value="">Select New Status</option>
                <option value="Booked">Booked</option>
                <option value="In Transit">In Transit</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
            </select>

            <button type="submit">Update Status</button>
        </form>

        <p id="message"></p>

        <a href="index.html">Back to Home</a>
    </div>

    <script>
        document.getElementById("statusForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const trackingId = document.getElementById("trackingId").value.trim();
            const status = document.getElementById("status").value;
            const message = document.getElementById("message");

            message.textContent = "Updating status...";

            try {
                const response = await fetch("/api/parcels/" + encodeURIComponent(trackingId) + "/status", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ status: status })
                });

                const data = await response.json();
                message.textContent = data.message || (response.ok ? "Status updated successfully." : "Unable to update status.");
            } catch (error) {
                message.textContent = "Server connection failed. Please check the server.";
            }
        });
    </script>
</body>
</html>
